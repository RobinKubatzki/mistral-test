services:
  # Nginx for frontend
  frontend:
    build: 
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "5173:80"
    volumes:
      - ../frontend:/var/www/html
    depends_on:
      - backend
    networks:
      - checkin-network

  # PHP backend
  backend:
    build: 
      context: ../backend
      dockerfile: ../docker/php/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=checkin_tool
      - DB_USERNAME=checkin_user
      - DB_PASSWORD=checkin_password
    depends_on:
      - mysql
    networks:
      - checkin-network

  # MySQL database
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=checkin_tool
      - MYSQL_USER=checkin_user
      - MYSQL_PASSWORD=checkin_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - checkin-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
    depends_on:
      - mysql
    networks:
      - checkin-network

volumes:
  mysql_data:

networks:
  checkin-network:
    driver: bridge
